<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1425">
<title>HOST0 — Academy Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
--p:#1a56a8;--p2:#2563eb;--d:#0c1425;--d2:#162544;--g:#0d9668;--o:#d97706;--r:#dc2626;
--bg:#f1f4f9;--c:#fff;--br:#dfe4ec;--t:#1e293b;--t2:#64748b;--t3:#94a3b8;
--rd:8px;--rd2:12px;--sh:0 2px 8px rgba(0,0,0,.06);--sh2:0 8px 24px rgba(0,0,0,.12);
--ai:#7c3aed;--ai-bg:#f5f3ff;--ai-br:#ddd6fe;
--gold:#d4a017;
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}input,textarea,select{font-family:inherit;font-size:14px}
#TT{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#LL{position:fixed;inset:0;background:rgba(12,20,37,.85);display:none;align-items:center;justify-content:center;z-index:998;backdrop-filter:blur(4px)}
#LL.s{display:flex}
#LL div{color:#fff;font-size:15px;font-weight:600}
.hd{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.hd h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hd small{font-size:10px;opacity:.5;display:block;margin-top:1px}
.hb{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600}
.nv{display:flex;background:var(--c);border-bottom:1px solid var(--br);overflow-x:auto}
.nv button{flex:1;min-width:60px;padding:9px 2px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--t3);font-size:10px;font-weight:500;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.nv button.a{font-weight:700;color:var(--p);border-bottom-color:var(--p)}
.ct{padding:16px;padding-bottom:90px}
.tl{font-size:18px;font-weight:800;margin:0 0 14px;letter-spacing:-.3px}
.cd{background:var(--c);border-radius:10px;border:1px solid var(--br);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.ch{padding:9px 14px;font-weight:700;font-size:11px;border-bottom:1px solid var(--br);letter-spacing:.5px;color:var(--t2);background:#f8fafc;text-transform:uppercase}
.cb{padding:14px}
.fg{margin-bottom:10px}
.fl{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--t2)}
.fi{width:100%;padding:10px 12px;border:1px solid var(--br);border-radius:var(--rd);font-size:14px;background:var(--c);color:var(--t);outline:none;transition:border .2s}
.fi:focus{border-color:var(--p)}
textarea.fi{min-height:50px;resize:vertical}
.btn{border:none;border-radius:var(--rd);padding:10px 20px;font-size:14px;font-weight:700;transition:all .15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--p);color:#fff}.bg{background:var(--g);color:#fff}.bo{background:var(--o);color:#fff}.br{background:var(--r);color:#fff}
.bs{background:transparent;color:var(--t);border:1px solid var(--br)}
.bf{width:100%}.bl{padding:14px;font-size:15px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.ib{background:#eef2f7;border-radius:var(--rd);padding:10px 14px;font-size:13px;color:var(--t2)}
.pb{height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .6s}
.lb{display:block;width:100%;padding:9px 14px;border:1px solid var(--br);border-radius:var(--rd);background:transparent;text-align:left;font-size:13px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.lb.s{border-color:var(--p);background:#eff6ff;color:var(--p);font-weight:700}
.hid{display:none}
.lg{display:flex;align-items:center;gap:14px;width:100%;max-width:340px;padding:16px 20px;border:none;border-radius:14px;color:#fff;text-align:left;margin-bottom:10px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.lg:active{transform:scale(.97)}
.lg small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px}
.stars{display:flex;gap:6px}.stars button{font-size:28px;background:none;border:none;opacity:.3;transition:all .15s}.stars button.on{opacity:1;transform:scale(1.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cd{animation:fadeIn .3s ease}

/* ── v8.1 OWNER CARD STYLES ── */
.ocard{background:var(--c);border-radius:var(--rd2);border:1px solid var(--br);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ocard:active{transform:scale(.99)}
.ocard.hero{border:none;background:linear-gradient(135deg,#0c1425,#1a365d)}
.ocard-h{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ocard-h .icon{font-size:18px}
.ocard-h .ttl{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.ocard-b{padding:0 16px 14px}
.ocard .arrow{color:var(--t3);font-size:18px;font-weight:300}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.metric-row .lbl{color:var(--t2)}
.metric-row .val{font-weight:700}
.big-num{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1}
.chip{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.chip-g{background:#d1fae5;color:#065f46}.chip-o{background:#fef3c7;color:#92400e}.chip-r{background:#fee2e2;color:#991b1b}.chip-b{background:#dbeafe;color:#1e40af}.chip-ai{background:var(--ai-bg);color:var(--ai)}
.ai-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:3px;background:var(--ai-bg);color:var(--ai)}

/* AI Recommendation card */
.airec{background:var(--ai-bg);border:1.5px solid var(--ai-br);border-radius:var(--rd2);margin:12px 0;overflow:hidden}
.airec-h{background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;padding:10px 14px;font-size:12px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.airec-b{padding:14px}
.airec .data-box{background:rgba(255,255,255,.6);border-radius:var(--rd);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--t2);line-height:1.7}
.airec .data-box b{color:var(--t)}
.airec .verdict{font-size:13px;color:var(--d);font-weight:600;line-height:1.6;margin-bottom:12px}
.airec .decision{background:var(--c);border-left:3px solid var(--ai);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.airec .decision .dh{font-size:11px;font-weight:800;color:var(--ai);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.airec .decision .dt{font-size:12px;color:var(--t);line-height:1.5}

/* Detail page sections */
.section{background:var(--c);border-radius:var(--rd2);border:1px solid var(--br);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.section-h{padding:11px 14px;font-weight:800;font-size:12px;letter-spacing:.3px;color:var(--d);background:#f8fafc;border-bottom:1px solid var(--br);text-transform:uppercase}
.section-b{padding:14px}
.backbtn{background:transparent;color:var(--t);border:1px solid var(--br);border-radius:var(--rd);padding:8px 16px;font-size:13px;font-weight:600;margin-bottom:14px}

/* Looking good / look into this items */
.signal{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--rd);margin-bottom:8px;font-size:12px;line-height:1.5}
.signal .sig-ic{font-size:16px;flex-shrink:0}
.signal.good{background:#f0fdf4;border-left:3px solid var(--g)}
.signal.high{background:#fef2f2;border-left:3px solid var(--r)}
.signal.med{background:#fffbeb;border-left:3px solid var(--o)}
.signal.low{background:#eff6ff;border-left:3px solid var(--p)}
.signal.info{background:#f8fafc;border-left:3px solid var(--t3)}
.signal .sig-tag{font-size:9px;color:var(--t3);font-weight:600;display:block;margin-top:2px}

/* Tables */
.dtable{width:100%;border-collapse:collapse;font-size:11px}
.dtable th{background:#f1f5f9;padding:7px 6px;text-align:left;font-weight:700;color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.dtable td{padding:7px 6px;border-bottom:1px solid #f1f5f9}
.dtable tr:active{background:#f8fafc}

/* Matrix */
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:11px}
.matrix .mh{font-weight:700;color:var(--t2);padding:6px;text-align:center;font-size:10px}
.matrix .mc{border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .15s}
.matrix .mc:active{transform:scale(.96)}
.matrix .mc .mc-n{font-size:22px;font-weight:900}
.matrix .mc .mc-l{font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.mc-best{background:#d1fae5;color:#065f46}
.mc-worst{background:#fee2e2;color:#991b1b}
.mc-honest{background:#dbeafe;color:#1e40af}
.mc-gap{background:#fef3c7;color:#92400e}

/* Sandbox banner */
.sandbar{background:linear-gradient(90deg,#fef3c7,#fde68a);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:#92400e}
.sandbar button{background:rgba(146,64,14,.15);border:none;color:#92400e;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;margin-left:4px}

/* Mini bar chart */
.minibar{display:flex;align-items:flex-end;gap:3px;height:50px;margin:8px 0}
.minibar .mbar{flex:1;background:var(--p);border-radius:3px 3px 0 0;min-height:3px;position:relative;transition:height .4s}
.dropoff{display:flex;flex-direction:column;gap:5px}
.dropoff .dorow{display:flex;align-items:center;gap:8px;font-size:11px}
.dropoff .dorow .dolabel{width:90px;color:var(--t2);flex-shrink:0}
.dropoff .dorow .dobar-wrap{flex:1;background:#e8ecf1;border-radius:3px;height:14px;overflow:hidden}
.dropoff .dorow .dobar{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:3px}
.dropoff .dorow .doval{width:54px;text-align:right;font-weight:700;font-size:11px}

.leg{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--g)}.dot-o{background:var(--o)}.dot-r{background:var(--r)}

.tabrow{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tabrow button{flex:1;padding:7px 4px;border:1px solid var(--br);border-radius:var(--rd);background:transparent;color:var(--t2);font-size:11px;font-weight:600;white-space:nowrap}
.tabrow button.s{border-color:var(--p);background:#eff6ff;color:var(--p)}

/* ═══════════════════════════════════════════════════════════
   COURT INTELLIGENCE — dark premium skin, scoped to .oskin (Owner view only)
   ═══════════════════════════════════════════════════════════ */
.oskin{
--O:#f97316;--O2:#fb923c;--Og:linear-gradient(135deg,#ea580c,#f97316);
--ink:#070b16;--ink2:#0d1426;--surf:#111a30;--surf2:#16203a;
--line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.22);
--tx:#eef2fb;--tx2:#9aa7c2;--tx3:#5f6c87;
--G:#10b981;--A:#f59e0b;--Rr:#fb5570;--AI:#a78bfa;--AI2:#8b5cf6;
font-family:'Sora','Tajawal',sans-serif;
min-height:100vh;color:var(--tx);
background:
radial-gradient(900px 500px at 85% -8%,rgba(249,115,22,.16),transparent 60%),
radial-gradient(800px 600px at 10% 105%,rgba(37,99,235,.14),transparent 55%),
linear-gradient(180deg,#070b16,#0a1020 40%,#070b16);
}
.oskin .ct{padding:16px;padding-bottom:96px}
.oskin .tl{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:-.6px;color:var(--tx)}

/* Brand header */
.oskin .hd{background:transparent!important;padding:16px 16px 6px}
.oskin .hd h2{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}
.oskin .hd h2 .z{color:var(--O)}
.oskin .hd small{color:var(--tx3);font-weight:500;letter-spacing:.4px}
.oskin .hb{background:rgba(148,163,184,.12);color:var(--tx2);border:1px solid var(--line)}

/* Nav — pill segmented */
.oskin .nv{background:rgba(13,20,38,.6);border:1px solid var(--line);border-radius:14px;margin:8px 16px 0;overflow:hidden;backdrop-filter:blur(8px)}
.oskin .nv button{color:var(--tx3);font-family:'Sora';font-weight:600}
.oskin .nv button.a{color:var(--O);border-bottom-color:var(--O)}
.oskin .nv button.a span{filter:drop-shadow(0 0 6px rgba(249,115,22,.5))}

/* Cards */
.oskin .cd,.oskin .section,.oskin .ocard{
background:linear-gradient(180deg,var(--surf),var(--ink2));
border:1px solid var(--line);border-radius:16px;
box-shadow:0 12px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
}
.oskin .ch,.oskin .section-h{
background:transparent;border-bottom:1px solid var(--line);color:var(--tx2);
font-family:'Sora';font-weight:700;letter-spacing:.8px;font-size:10.5px;padding:11px 16px;text-transform:uppercase
}
.oskin .cb,.oskin .section-b{padding:15px 16px}
.oskin .ib{background:rgba(148,163,184,.08);color:var(--tx2);border:1px solid var(--line);border-radius:12px}

/* Inputs / buttons in owner */
.oskin .fl{color:var(--tx3);font-family:'Sora';font-weight:600}
.oskin .fi{background:rgba(7,11,22,.6);border:1px solid var(--line2);color:var(--tx);border-radius:10px}
.oskin .fi:focus{border-color:var(--O)}
.oskin .btn{font-family:'Sora';font-weight:700;border-radius:10px}
.oskin .bp{background:var(--Og);color:#fff;box-shadow:0 8px 20px -8px rgba(249,115,22,.6)}
.oskin .bg{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.oskin .br{background:linear-gradient(135deg,#e11d48,#fb5570);color:#fff}
.oskin .bs{background:rgba(148,163,184,.08);border:1px solid var(--line2);color:var(--tx2)}
.oskin .lb{border:1px solid var(--line2);color:var(--tx2);background:rgba(7,11,22,.4);border-radius:10px}
.oskin .lb.s{border-color:var(--O);background:rgba(249,115,22,.14);color:var(--O2)}
.oskin .av{background:var(--Og);border-radius:13px;box-shadow:0 6px 16px -6px rgba(249,115,22,.6)}
.oskin .pb{background:rgba(148,163,184,.14)}
.oskin .backbtn{background:rgba(148,163,184,.08);border:1px solid var(--line2);color:var(--tx2);font-family:'Sora';font-weight:600;border-radius:10px}

/* Owner home grid */
.oskin .home-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.oskin .home-brand .bz{font-family:'Sora';font-weight:800;font-size:24px;letter-spacing:-1px}
.oskin .home-brand .bz .z{color:var(--O)}
.oskin .home-brand .tagline{font-size:9px;color:var(--tx3);letter-spacing:.3px;margin-top:1px}
.oskin .home-brand .month{font-size:10px;color:var(--tx3);font-family:'Sora';font-weight:600;text-align:right;background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:8px;padding:5px 10px}

/* OCARD — premium */
.oskin .ocard{margin-bottom:13px;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;animation:oin .5s ease both}
.oskin .ocard:active{transform:scale(.985)}
.oskin .ocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,transparent)}
.oskin .ocard.sev-r{--accent:var(--Rr);box-shadow:0 12px 30px -12px rgba(251,85,112,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.oskin .ocard.sev-a{--accent:var(--A)}
.oskin .ocard.sev-g{--accent:var(--G)}
.oskin .ocard-h{padding:13px 16px 6px}
.oskin .ocard-h .icon{font-size:17px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.oskin .ocard-h .ttl{font-family:'Sora';font-weight:700;font-size:12px;letter-spacing:.6px;color:var(--tx)!important;text-transform:uppercase}
.oskin .ocard-h .arrow{color:var(--tx3);font-size:20px}
.oskin .ocard-b{padding:0 16px 15px;color:var(--tx2)}
.oskin .metric-row{padding:6px 0;border-bottom:1px solid rgba(148,163,184,.07);font-size:13px}
.oskin .metric-row:last-child{border-bottom:none}
.oskin .metric-row .lbl{color:var(--tx3);font-size:12px}
.oskin .metric-row .val{color:var(--tx);font-family:'Sora';font-weight:700;font-variant-numeric:tabular-nums}
.oskin .big-num{font-family:'Sora';font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}

/* status dot in card header */
.oskin .sevdot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 4px var(--glow,transparent)}
.oskin .sevdot.r{background:var(--Rr);--glow:rgba(251,85,112,.18);animation:pulse 2s infinite}
.oskin .sevdot.a{background:var(--A);--glow:rgba(245,158,11,.18)}
.oskin .sevdot.g{background:var(--G);--glow:rgba(16,185,129,.16)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(251,85,112,.18)}50%{box-shadow:0 0 0 7px rgba(251,85,112,.05)}}
@keyframes oin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.oskin .ocard:nth-child(2){animation-delay:.04s}.oskin .ocard:nth-child(3){animation-delay:.08s}
.oskin .ocard:nth-child(4){animation-delay:.12s}.oskin .ocard:nth-child(5){animation-delay:.16s}
.oskin .ocard:nth-child(6){animation-delay:.2s}.oskin .ocard:nth-child(7){animation-delay:.24s}

/* HERO insight */
.oskin .hero{
border:1px solid rgba(249,115,22,.25)!important;
background:
radial-gradient(500px 200px at 100% 0,rgba(249,115,22,.22),transparent 70%),
linear-gradient(160deg,#13203c,#0c1530 70%,#0a1126)!important;
}
.oskin .hero::before{display:none}
.oskin .hero .ocard-h .ttl{color:#fff!important}
.oskin .hero .synth{font-size:13.5px;line-height:1.55;color:#d6deef;margin-bottom:13px}
.oskin .hero .pills{display:flex;gap:10px}
.oskin .hero .pill{flex:1;border-radius:13px;padding:11px 13px;border:1px solid var(--line)}
.oskin .hero .pill.good{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3)}
.oskin .hero .pill.into{background:rgba(251,85,112,.12);border-color:rgba(251,85,112,.3)}
.oskin .hero .pill .pn{font-family:'Sora';font-weight:800;font-size:26px;letter-spacing:-1px}
.oskin .hero .pill.good .pn{color:#34d399}.oskin .hero .pill.into .pn{color:#fb7185}
.oskin .hero .pill .pl{font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}

/* chips */
.oskin .chip{font-family:'Sora';font-weight:700}
.oskin .chip-g{background:rgba(16,185,129,.16);color:#34d399}
.oskin .chip-o{background:rgba(245,158,11,.16);color:#fbbf24}
.oskin .chip-r{background:rgba(251,85,112,.16);color:#fb7185}
.oskin .chip-b{background:rgba(96,165,250,.16);color:#93c5fd}

/* AI rec — premium violet on dark */
.oskin .airec{background:linear-gradient(180deg,rgba(139,92,246,.1),rgba(124,58,237,.04));border:1px solid rgba(167,139,250,.3);border-radius:16px;box-shadow:0 12px 30px -14px rgba(124,58,237,.5)}
.oskin .airec-h{background:linear-gradient(135deg,#6d28d9,#8b5cf6);font-family:'Sora';font-weight:700;letter-spacing:.4px}
.oskin .airec .data-box{background:rgba(7,11,22,.5);border:1px solid var(--line);color:var(--tx2);border-radius:11px}
.oskin .airec .data-box b{color:var(--tx)}
.oskin .airec .data-box b[style]{color:var(--AI)!important}

var focus=(session.skill_focus||"").split(",").map(function(s){return s.trim()}).filter(Boolean);
focus.slice(0,3).forEach(function(sid){

qs.push({k:"focus_"+sid,q:"Were the focus drills on "+nm+" actually run as planned?"});
});

}

// ─── API ──────────────
function apiGet(){
load(true);
return fetch(API+"?action=getAll").then(function(r){return r.json()}).then(function(d){
if(d.success){
d.evaluations=(d.evaluations||[]).map(function(e){
var sk=e.skills||e.skills_json||{};
if(typeof sk==="string"){try{sk=JSON.parse(sk)}catch(x){sk={}}}
return Object.assign({},e,{
attended:e.attended===true||e.attended==="true"||e.attended==="TRUE",
parent_attended:e.parent_attended===true||e.parent_attended==="true"||e.parent_attended==="TRUE",
skills:sk});
});
d.players=(d.players||[]).map(function(p){return Object.assign({},p,{
active:p.active!==false&&p.active!=="false"&&p.active!=="FALSE",
age:Number(p.age)||0});
});
S.d=d;
loadConfig();
}
load(false);
}).catch(function(e){load(false);toast("Connection error — check API URL")});
}
function apiPost(body){
load(true);
return fetch(API,{method:"POST",body:JSON.stringify(body),headers:{"Content-Type":"text/plain"}})
.then(function(r){return r.json()}).then(function(d){
load(false);
if(d.success){return apiGet().then(function(){return true})}
else{toast("Error: "+(d.error||"unknown"));return false}
}).catch(function(e){load(false);toast("Network error");return false});
}

function loadConfig(){
S.cfg={};
(S.d.settings||[]).forEach(function(s){if(s.key)S.cfg[s.key]=s.value});
var cm=(S.d.messages||[]).filter(function(m){return m.type==="academy_config"});
if(cm.length){try{var c=JSON.parse(cm[cm.length-1].text.replace("CONFIG:",""));Object.keys(c).forEach(function(k){if(S.cfg[k]==null)S.cfg[k]=c[k]})}catch(e){}}
}
function cfgVal(k,def){return S.cfg[k]!=null&&S.cfg[k]!==""?S.cfg[k]:def}

var byCat={};
RCATS.forEach(function(cat){
var vals=ev.map(function(e){var v=cat.sk.map(function(s){return Number(e.skills[s])||0}).filter(function(x){return x>0});return v.length?av(v):0}).filter(function(x){return x>0});
byCat[cat.id]={avg:av(vals),trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
var bySk={};
SKILL_LIST.forEach(function(sid){
var vals=ev.map(function(e){return Number(e.skills[sid])||0}).filter(function(x){return x>0});
if(vals.length)bySk[sid]={avg:av(vals),lat:vals[vals.length-1],prev:vals.length>=2?vals[vals.length-2]:0,trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
var overall=av(Object.values(byCat).map(function(c){return c.avg}).filter(function(x){return x>0}));
var prevOverall=0;
if(prev){var pc=[];RCATS.forEach(function(cat){var v=cat.sk.map(function(s){return Number(prev.skills[s])||0}).filter(function(x){return x>0});if(v.length)pc.push(av(v))});prevOverall=av(pc)}
var allEv=S.d.evaluations.filter(function(e){return e.player_id===pid});
var att=allEv.length?(allEv.filter(function(e){return e.attended}).length/allEv.length*100):0;
return{sessions:ev.length,byCat:byCat,bySk:bySk,overall:overall,prevOverall:prevOverall,att:att,latest:lat,prev:prev}
}

// Drop-off curve — retention at session intervals
function dropoffCurve(){
var sorted=sessionsSorted();
var intervals=[1,4,12,24,48];
var joined=S.d.players.length;
var out=[{label:"Joined",count:joined,pct:100}];
intervals.forEach(function(iv){
// kids who attended at least iv sessions
var retained=S.d.players.filter(function(p){
var n=S.d.evaluations.filter(function(e){return e.player_id===p.id&&e.attended}).length;

// Pattern-detected leaver
function patternLeavers(){
var sorted=sessionsSorted();
var threshold=Number(cfgVal("pattern_leaver_consecutive_misses",3));
var out=[];
activePlayers().forEach(function(p){
if(isKidOnHold(p.id))return;
// consecutive misses from the end
var miss=0;
for(var i=sorted.length-1;i>=0;i--){
var ev=S.d.evaluations.find(function(e){return e.session_id===sorted[i].id&&e.player_id===p.id});
if(ev&&ev.attended)break;
miss++;
}
if(miss>=threshold)out.push({pid:p.id,name:p.name,misses:miss});
});
return out;
}

// ── Relationship Health — 3 legs per kid ──
function relationshipHealth(pid){
var p=S.d.players.find(function(x){return x.id===pid});
var st=stats(pid);
// Leg 1: coach-kid (from skill data — engagement: coachability/effort)
var coachLeg="green";
if(st&&st.latest){
var coach=Number(st.latest.skills.coachability)||0,eff=Number(st.latest.skills.effort)||0;
var m=av([coach,eff].filter(function(x){return x>0}));
coachLeg=m>=3.5?"green":m>=2.5?"yellow":"red";
}else coachLeg="gray";
// Leg 2: parent engagement
var pfb=getParentFeedbackV2(pid),checkins=S.d.messages.filter(function(m){return m.type==="parent_checkin"&&String(m.from_name).indexOf(p.name)>=0});
var parentActivity=pfb.length+checkins.length;
var parentLeg=parentActivity>=2?"green":parentActivity===1?"yellow":"red";
// Leg 3: kid commitment (attendance + kid survey pride)
var ac=attendanceCategory(pid);
var ksv=getKidSurveyV2(pid);
var kidLeg="green";
if(ac.pct<30)kidLeg="red";
else if(ac.pct<60)kidLeg="yellow";
if(ksv.length){var pride=ksv[ksv.length-1].q9_pride;if(pride==="Not really"||pride==="I'm not improving")kidLeg="red";else if(pride==="Not sure"&&kidLeg==="green")kidLeg="yellow"}
var legs=[coachLeg,parentLeg,kidLeg];
var redCount=legs.filter(function(l){return l==="red"}).length;
var yellowCount=legs.filter(function(l){return l==="yellow"}).length;
var overall=redCount>=2?"priority":redCount===1||yellowCount>=2?"partial":"healthy";
return{coachLeg:coachLeg,parentLeg:parentLeg,kidLeg:kidLeg,overall:overall,redCount:redCount,yellowCount:yellowCount};
}

// ── Development Picture — triangulation ──
function developmentSignal(pid){
var st=stats(pid);
// Coach view: improving / stable / declining
var coachDir="nodata";
if(st&&st.prev){
var d=st.overall-st.prevOverall;
coachDir=d>0.15?"up":d<-0.15?"down":"stable";
}
// Parent feeling (from feedback experience trend + value)
var pfb=getParentFeedbackV2(pid);
var parentDir="nodata";
if(pfb.length){
var last=pfb[pfb.length-1];
var exp=last.q1_experience,val=last.q3_value;
if(exp==="Very happy"||exp==="Happy"){parentDir="up"}
else if(exp==="Mixed"){parentDir=(val==="Poor value"||val==="Acceptable")?"down":"stable"}
else parentDir="down";
}
// Kid self-perception (from pride q9)
var ksv=getKidSurveyV2(pid);
var kidDir="nodata";
if(ksv.length){
var pride=ksv[ksv.length-1].q9_pride;
if(pride==="Very proud"||pride==="A bit proud")kidDir="up";
else if(pride==="Not sure")kidDir="stable";
else kidDir="down";
}
// Alignment
var familyFeels=(parentDir==="up"||kidDir==="up")&&parentDir!=="down"&&kidDir!=="down";
var familyDoesnt=(parentDir==="down"||kidDir==="down"||parentDir==="stable"||kidDir==="stable")&&!(parentDir==="up"&&kidDir==="up");
var coachSaysUp=coachDir==="up";
var quad;
if(coachSaysUp&&familyFeels)quad="best";
else if(coachSaysUp&&!familyFeels)quad="worst";   // TRUST MISMATCH
else if(!coachSaysUp&&familyFeels)quad="honest";
else quad="gap";
return{coachDir:coachDir,parentDir:parentDir,kidDir:kidDir,quad:quad};
}

// ── COACH PRE-SESSION BRIEF ──
function coachBrief(session){
var kids=assignedKids(session).map(function(pid){return S.d.players.find(function(p){return p.id===pid})}).filter(Boolean);
if(!kids.length)kids=activePlayers();
return kids.map(function(p){
var checkins=S.d.messages.filter(function(m){return m.type==="parent_checkin"&&String(m.from_name).indexOf(p.name)>=0}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});
var lastChk=checkins[0];
var flags=[];
if(lastChk){
var t=lastChk.text;
var sl=(t.match(/Sleep:(\d)/)||[])[1];
var md=(t.match(/Mood:(\d)/)||[])[1];
if(sl&&Number(sl)<=2)flags.push({c:"tired",t:"slept poorly"});
if(md&&Number(md)<=2)flags.push({c:"reluctant",t:"low mood"});
if(md&&Number(md)>=5)flags.push({c:"excited",t:"excited"});
}
// previous session for this kid
var prevEv=S.d.evaluations.filter(function(e){return e.player_id===p.id&&e.attended}).map(function(e){var s=S.d.sessions.find(function(ss){return ss.id===e.session_id});return{e:e,s:s}}).filter(function(x){return x.s}).sort(function(a,b){return new Date(b.s.date)-new Date(a.s.date)});
var last=prevEv[0];
// level transition: any skill near a boundary (last rating 2 or 4 = pending move)
var st=stats(p.id);var transition=null;
if(st&&st.latest){SKILL_LIST.forEach(function(sid){var v=Number(st.latest.skills[sid])||0;if(v===2||v===4){if(!transition)transition=SK[sid]?SK[sid].n:sid}})}

});
}

// what's next: skills at level 2 or 4 (transition candidates)
var next=[];
if(st){SKILL_LIST.forEach(function(sid){var sd=st.bySk[sid];if(sd&&(sd.lat===2||sd.lat===4)){next.push({skill:SK[sid].n,from:sd.lat,to:sd.lat+1})}})}
return{p:p,st:st,conf:conf,narrative:narrative,coaches:coaches,next:next.slice(0,3)};
}
function statsFrom(pid,ev){
// like stats() but operating on a provided evaluation set (report-source filtered)
if(!ev||!ev.length)return null;
ev=ev.slice().sort(function(a,b){var sa=S.d.sessions.find(function(s){return s.id===a.session_id}),sb=S.d.sessions.find(function(s){return s.id===b.session_id});return new Date(sa?sa.date:0)-new Date(sb?sb.date:0)});
var byCat={},bySk={};
RCATS.forEach(function(cat){var vals=ev.map(function(e){var v=cat.sk.map(function(s){return Number(e.skills[s])||0}).filter(function(x){return x>0});return v.length?av(v):0}).filter(function(x){return x>0});byCat[cat.id]={avg:av(vals),trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
SKILL_LIST.forEach(function(sid){var vals=ev.map(function(e){return Number(e.skills[sid])||0}).filter(function(x){return x>0});if(vals.length)bySk[sid]={avg:av(vals),lat:vals[vals.length-1],trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
var overall=av(Object.values(byCat).map(function(c){return c.avg}).filter(function(x){return x>0}));
return{sessions:ev.length,byCat:byCat,bySk:bySk,overall:overall,latest:ev[ev.length-1]};
}
function buildParentNarrative(p,st,conf){
var nm=p.name.split(" ")[0];
if(!st)return nm+" is just getting started with us. As "+nm+" trains over the coming sessions, this report will fill with the specific story of how they're growing.";
var parts=[];
var topSk=Object.keys(st.bySk).map(function(sid){return{n:SK[sid].n,v:st.bySk[sid].lat,t:st.bySk[sid].trend}}).sort(function(a,b){return b.v-a.v});
var improving=topSk.filter(function(s){return s.t>0});
parts.push("Over "+st.sessions+" session"+(st.sessions>1?"s":"")+" this period, "+nm+" is developing steadily across the board.");
if(topSk.length)parts.push(nm+"'s strongest area right now is "+topSk[0].n+".");
if(improving.length)parts.push("We're seeing clear growth in "+improving.slice(0,2).map(function(s){return s.n}).join(" and ")+".");
var effortSk=st.bySk.effort;
if(effortSk&&effortSk.lat>=4)parts.push("Most importantly, "+nm+"'s effort has been excellent — that's the quality that drives everything else.");
return parts.join(" ");
}

function buildInsights(){

lookingGood.push({card:"Business Growth",cardKey:"growth",text:(JOIN_SOURCES[topSource]||topSource)+" is your strongest acquisition channel ("+joiners[topSource]+" joiners)"});

var cohorts=cohortRetention();
Object.keys(cohorts).forEach(function(q){
if(q!=="Unknown"&&cohorts[q].total>=2&&cohorts[q].active===cohorts[q].total)
lookingGood.push({card:"Business Growth",cardKey:"growth",text:q+" cohort at 100% retention ("+cohorts[q].total+" kids)"});
});

// Pattern leavers → high priority
var pl=patternLeavers();
pl.forEach(function(l){
lookInto.push({pri:"HIGH",card:"Relationship Health",cardKey:"relationship",text:l.name+" missed "+l.misses+" consecutive sessions — reach out this week"});
});

// Trust mismatches → high priority
players.forEach(function(p){

if(sig.quad==="worst")
lookInto.push({pri:"HIGH",card:"Development Picture",cardKey:"development",text:p.name+" trust mismatch — coach sees progress, family doesn't. Send video evidence."});
});

// Value perception → medium
var valueConcerns=0;
players.forEach(function(p){
var pfb=getParentFeedbackV2(p.id);
if(pfb.length&&pfb[pfb.length-1].q3_value==="Poor value")valueConcerns++;
});
if(valueConcerns>0)
lookInto.push({pri:"MED",card:"Customer Feedback",cardKey:"feedback",text:valueConcerns+" parent(s) flagged poor value-for-money"});

// Multi-leg risk → medium
players.forEach(function(p){
var rh=relationshipHealth(p.id);
if(rh.overall==="priority"){
var already=lookInto.some(function(x){return x.text.indexOf(p.name)>=0});
if(!already)lookInto.push({pri:"MED",card:"Relationship Health",cardKey:"relationship",text:p.name+" — multiple relationship signals weakening"});
}
});

// Venue/timing → low
var vs=venueSignals();
var morningWant=(vs.timingPref["Sat morning"]||0)+(vs.timingPref["Saturday morning"]||0);
if(morningWant>=3)
lookInto.push({pri:"LOW",card:"Session Health",cardKey:"sessions",text:morningWant+" parents prefer a morning slot — consider piloting"});
if(vs.concernCount>=3)
lookInto.push({pri:"LOW",card:"Session Health",cardKey:"sessions",text:vs.concernCount+" parents rated venue Adequate or worse"});

// Coach health
var cf=getCoachFeedback();
if(cf.length){
var lastCf=cf[cf.length-1];
lookingGood.push({card:"Customer Feedback",cardKey:"feedback",text:"Coach actively reporting — "+cf.length+" monthly feedback submissions"});
}

// Sort lookInto by priority
var prio={HIGH:3,MED:2,LOW:1,INFO:0};
lookInto.sort(function(a,b){return (prio[b.pri]||0)-(prio[a.pri]||0)});

return{lookingGood:lookingGood,lookInto:lookInto};
}

curve.forEach(function(c){
h+='<div class="dorow"><div class="dolabel">'+c.label+(c.projected?" *":"")+'</div><div class="dobar-wrap"><div class="dobar" style="width:'+c.pct+'%"></div></div><div class="doval">'+c.count+' ('+c.pct+'%)</div></div>';

h+='</div></div>';

h+='<div class="section"><div class="section-h">Cohort Retention (quarterly)</div><div class="section-b">';
Object.keys(cohorts).sort().reverse().forEach(function(q){

h+=aiRecCard("",aiRecGrowth());

});
h+='</table></div></div>';

h+=aiRecCard("",aiRecDevelopment());

// Per-mismatch-kid recommendations
quads.worst.forEach(function(p){
h+=aiRecCard(esc(p.name)+" (trust mismatch)",aiRecTrustMismatch(p.id));
});
return h;
}

sess.forEach(function(s){h+=calRow(s,now)});

});
}else{
// week/month = flat list filtered
var horizon=S.calView==="week"?7:31;

var dot=planned?'<span class="chip chip-b">PLAN</span>':'<span class="chip chip-g">DONE</span>';
var detail=planned?(s.skill_focus?("Focus: "+s.skill_focus.split(",").map(function(x){return SK[x.trim()]?SK[x.trim()].n:x.trim()}).join(", ")):"Planned"):(att+"/"+ev.length+" attended");

if(vis.indexOf("coach")>=0)h+=lgBtn("pinc","\uD83D\uDCCB","Coach","\u0627\u0644\u0645\u062F\u0631\u0628","linear-gradient(135deg,#1d4ed8,#2563eb)");
if(vis.indexOf("evaluator")>=0)h+=lgBtn("pine","\uD83D\uDD0D","Evaluator","\u0627\u0644\u0645\u0642\u064A\u0651\u0645","linear-gradient(135deg,#0284c7,#0ea5e9)");
if(vis.indexOf("parent")>=0)h+=lgBtn("pinp","\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67\u200D\uD83D\uDC66","Parent","\u0648\u0644\u064A \u0627\u0644\u0623\u0645\u0631","linear-gradient(135deg,#047857,#059669)");
if(vis.indexOf("kid")>=0)h+=lgBtn("pink","\uD83C\uDFC0","Player","\u0627\u0644\u0644\u0627\u0639\u0628","linear-gradient(135deg,#0e7490,#06b6d4)");
h+='<div style="color:rgba(148,163,184,.3);font-size:10px;margin-top:20px;letter-spacing:.5px">v'+VERSION+' \u00B7 Sandbox</div></div>';
return h;
}
function lgBtn(mode,icon,title,ar,grad){return '<button class="lg" style="display:flex;align-items:center;gap:14px;width:100%;max-width:340px;padding:16px 20px;border:none;border-radius:16px;color:#fff;text-align:left;margin-bottom:10px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);background:'+grad+'" onclick="S.mode=\''+mode+'\';R()">'+icon+' <div>'+title+'<small style="display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px">'+ar+'</small></div></button>'}
// before login we don't have config loaded; default all visible. After a fetch, S.cfg drives it.
function visibleRolesPre(){if(S.cfg&&S.cfg.visible_roles)return String(S.cfg.visible_roles).split(",").map(function(x){return x.trim()});return["owner","coach","evaluator","parent","kid"]}

function vPin(label,target,icon,len,grad){
var h='<div style="min-height:100vh;font-family:\'Sora\',\'Tajawal\',sans-serif;background:radial-gradient(600px 400px at 50% -5%,rgba(249,115,22,.18),transparent 60%),linear-gradient(180deg,#070b16,#0a1020 50%,#070b16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">';
h+='<div style="font-size:48px;margin-bottom:8px">'+icon+'</div><div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:20px;font-family:\'Sora\'">'+label+'</div>';
h+='<input id="pv" type="tel" inputmode="numeric" maxlength="'+len+'" style="width:200px;padding:14px;font-size:24px;text-align:center;letter-spacing:8px;border:1px solid rgba(148,163,184,.25);border-radius:14px;margin-bottom:14px;background:rgba(13,20,38,.7);color:#fff;font-family:\'Sora\'" placeholder="\u2022\u2022\u2022\u2022" autofocus>';
h+='<button class="btn bl" style="width:200px;background:'+(grad||"linear-gradient(135deg,#ea580c,#f97316)")+';color:#fff;border-radius:14px" onclick="ckPin(\''+target+'\')">Enter</button>';
h+='<button style="background:none;border:none;color:rgba(148,163,184,.4);font-size:13px;margin-top:16px;font-family:\'Sora\'" onclick="logout()">\u2190 Back</button></div>';
return h;
}
function ckPin(t){
var pin=document.getElementById("pv").value.trim();
if(t==="admin"){if(pin===PIN_A){S.mode="admin";apiGet().then(function(){logLogin("Admin","Admin");R()})}else toast("Wrong PIN")}
else if(t==="coach"){toast("Loading\u2026");apiGet().then(function(){var c=getCoaches().find(function(x){return String(x.pin).trim()===pin&&x.active!==false});if(c){S.coachId=c.id;S.coachName=c.name;S.mode="coach";S.ct="brief";logLogin("Coach",c.name);R()}else if(pin===PIN_C){S.coachId="";S.coachName="Coach";S.mode="coach";S.ct="brief";logLogin("Coach","Coach");R()}else toast("Invalid PIN")})}
else if(t==="evaluator"){toast("Loading\u2026");apiGet().then(function(){var e=getEvaluators().find(function(x){return String(x.pin).trim()===pin&&x.active!==false});if(e){S.evalId=e.id;S.evalName=e.name;S.mode="evaluator";logLogin("Evaluator",e.name);R()}else toast("Invalid PIN")})}
else if(t==="parent"){toast("Loading\u2026");apiGet().then(function(){var ch=S.d.players.find(function(p){return String(p.parent_pin||"").trim()===pin});if(ch){S.cid=ch.id;S.mode="parent";S.pt="report";logLogin("Parent",ch.name);R()}else toast("Invalid PIN")})}
else if(t==="kid"){toast("Loading\u2026");apiGet().then(function(){var ch=S.d.players.find(function(p){return kidPin(p.parent_pin)===pin});if(ch){S.cid=ch.id;S.mode="kid";S.kt="progress";logLogin("Kid",ch.name);R()}else toast("Invalid PIN")})}
}
function logLogin(role,name){apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:role+": "+name,text:"LOGIN:"+role+":"+name+":"+new Date().toLocaleString("en-GB"),type:"login_log"}})}

// ─── ADMIN SHELL (owner) ───
function vAdmin(){
var academyName=cfgVal("academy_name","HOST Academy");
var mode=academyMode();
var h='<div class="oskin">';
h+='<div class="hd"><div><h2>HOST<span class="z">0</span> <span style="font-size:11px;opacity:.4">\u2022</span> '+esc(academyName)+'</h2><small>Owner \u00B7 '+(mode==="full"?"Full mode":"Light mode")+' \u00B7 v'+VERSION+'</small></div><button class="hb" onclick="logout()">Logout</button></div>';
var tabs=[["dashboard","\uD83D\uDCCA","Owner"],["calendar","\uD83D\uDCC5","Calendar"],["players","\uD83D\uDC65","Players"],["coaches","\uD83D\uDCCB","Coaches"],["evaluators","\uD83D\uDD0D","Eval"],["skills","\uD83C\uDFAF","Skills"],["sandbox","\uD83E\uDDEA","Test"],["settings","\u2699\uFE0F","Setup"]];
h+='<div class="nv">';tabs.forEach(function(t){h+='<button class="'+(S.at===t[0]?"a":"")+'" onclick="ownerTab(\''+t[0]+'\')"><span style="font-size:15px">'+t[1]+'</span>'+t[2]+'</button>'});h+='</div>';
h+='<div class="ct">';
if(S.at==="dashboard")h+=(S.ownerCard?vOwnerDetail():vOwnerHome());
else if(S.at==="calendar")h+=vOwnerCalendar();
else if(S.at==="players")h+=(S.sp?vAdminReport():vAdminPlayers());
else if(S.at==="coaches")h+=vOwnerCoaches();
else if(S.at==="evaluators")h+=vOwnerEvaluators();
else if(S.at==="skills")h+=vOwnerSkills();
else if(S.at==="sandbox")h+=vSandbox();
else if(S.at==="settings")h+=vOwnerSettings();
h+='</div></div>';
return h;
}
function ownerTab(t){S.at=t;S.ownerCard=null;S.sp=null;S.calSession=null;S.scheduleNew=null;S.editCoach=null;S.editEval=null;R()}

// boot
R();

</script>
</body>
</html>
