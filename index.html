<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>HOST0 — Academy Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--p:#1a56a8;--p2:#2563eb;--d:#0c1425;--d2:#162544;--g:#0d9668;--o:#d97706;--r:#dc2626;
--bg:#f1f4f9;--c:#fff;--br:#dfe4ec;--t:#1e293b;--t2:#64748b;--t3:#94a3b8;
--rd:8px;--rd2:12px;--sh:0 2px 8px rgba(0,0,0,.06);--sh2:0 8px 24px rgba(0,0,0,.12);
--ai:#7c3aed;--ai-bg:#f5f3ff;--ai-br:#ddd6fe;
--gold:#d4a017;
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}input,textarea,select{font-family:inherit;font-size:14px}
#TT{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 28px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
#LL{position:fixed;inset:0;background:rgba(12,20,37,.85);display:none;align-items:center;justify-content:center;z-index:998;backdrop-filter:blur(4px)}
#LL.s{display:flex}
#LL div{color:#fff;font-size:15px;font-weight:600}
.hd{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.hd h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hd small{font-size:10px;opacity:.5;display:block;margin-top:1px}
.hb{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600}
.nv{display:flex;background:var(--c);border-bottom:1px solid var(--br);overflow-x:auto}
.nv button{flex:1;min-width:60px;padding:9px 2px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--t3);font-size:10px;font-weight:500;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.nv button.a{font-weight:700;color:var(--p);border-bottom-color:var(--p)}
.ct{padding:16px;padding-bottom:90px}
.tl{font-size:18px;font-weight:800;margin:0 0 14px;letter-spacing:-.3px}
.cd{background:var(--c);border-radius:10px;border:1px solid var(--br);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.ch{padding:9px 14px;font-weight:700;font-size:11px;border-bottom:1px solid var(--br);letter-spacing:.5px;color:var(--t2);background:#f8fafc;text-transform:uppercase}
.cb{padding:14px}
.fg{margin-bottom:10px}
.fl{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--t2)}
.fi{width:100%;padding:10px 12px;border:1px solid var(--br);border-radius:var(--rd);font-size:14px;background:var(--c);color:var(--t);outline:none;transition:border .2s}
.fi:focus{border-color:var(--p)}
textarea.fi{min-height:50px;resize:vertical}
.btn{border:none;border-radius:var(--rd);padding:10px 20px;font-size:14px;font-weight:700;transition:all .15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--p);color:#fff}.bg{background:var(--g);color:#fff}.bo{background:var(--o);color:#fff}.br{background:var(--r);color:#fff}
.bs{background:transparent;color:var(--t);border:1px solid var(--br)}
.bf{width:100%}.bl{padding:14px;font-size:15px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.ib{background:#eef2f7;border-radius:var(--rd);padding:10px 14px;font-size:13px;color:var(--t2)}
.pb{height:6px;background:#e8ecf1;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .6s}
.lb{display:block;width:100%;padding:9px 14px;border:1px solid var(--br);border-radius:var(--rd);background:transparent;text-align:left;font-size:13px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.lb.s{border-color:var(--p);background:#eff6ff;color:var(--p);font-weight:700}
.hid{display:none}
.lg{display:flex;align-items:center;gap:14px;width:100%;max-width:340px;padding:16px 20px;border:none;border-radius:14px;color:#fff;text-align:left;margin-bottom:10px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s}
.lg:active{transform:scale(.97)}
.lg small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px}
.stars{display:flex;gap:6px}.stars button{font-size:28px;background:none;border:none;opacity:.3;transition:all .15s}.stars button.on{opacity:1;transform:scale(1.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cd{animation:fadeIn .3s ease}

/* ── v8.1 OWNER CARD STYLES ── */
.ocard{background:var(--c);border-radius:var(--rd2);border:1px solid var(--br);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ocard:active{transform:scale(.99)}
.ocard.hero{border:none;background:linear-gradient(135deg,#0c1425,#1a365d)}
.ocard-h{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ocard-h .icon{font-size:18px}
.ocard-h .ttl{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.ocard-b{padding:0 16px 14px}
.ocard .arrow{color:var(--t3);font-size:18px;font-weight:300}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.metric-row .lbl{color:var(--t2)}
.metric-row .val{font-weight:700}
.big-num{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1}
.chip{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.chip-g{background:#d1fae5;color:#065f46}.chip-o{background:#fef3c7;color:#92400e}.chip-r{background:#fee2e2;color:#991b1b}.chip-b{background:#dbeafe;color:#1e40af}.chip-ai{background:var(--ai-bg);color:var(--ai)}
.ai-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:3px;background:var(--ai-bg);color:var(--ai)}

/* AI Recommendation card */
.airec{background:var(--ai-bg);border:1.5px solid var(--ai-br);border-radius:var(--rd2);margin:12px 0;overflow:hidden}
.airec-h{background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;padding:10px 14px;font-size:12px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.airec-b{padding:14px}
.airec .data-box{background:rgba(255,255,255,.6);border-radius:var(--rd);padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--t2);line-height:1.7}
.airec .data-box b{color:var(--t)}
.airec .verdict{font-size:13px;color:var(--d);font-weight:600;line-height:1.6;margin-bottom:12px}
.airec .decision{background:var(--c);border-left:3px solid var(--ai);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.airec .decision .dh{font-size:11px;font-weight:800;color:var(--ai);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.airec .decision .dt{font-size:12px;color:var(--t);line-height:1.5}

/* Detail page sections */
.section{background:var(--c);border-radius:var(--rd2);border:1px solid var(--br);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.section-h{padding:11px 14px;font-weight:800;font-size:12px;letter-spacing:.3px;color:var(--d);background:#f8fafc;border-bottom:1px solid var(--br);text-transform:uppercase}
.section-b{padding:14px}
.backbtn{background:transparent;color:var(--t);border:1px solid var(--br);border-radius:var(--rd);padding:8px 16px;font-size:13px;font-weight:600;margin-bottom:14px}

/* Looking good / look into this items */
.signal{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--rd);margin-bottom:8px;font-size:12px;line-height:1.5}
.signal .sig-ic{font-size:16px;flex-shrink:0}
.signal.good{background:#f0fdf4;border-left:3px solid var(--g)}
.signal.high{background:#fef2f2;border-left:3px solid var(--r)}
.signal.med{background:#fffbeb;border-left:3px solid var(--o)}
.signal.low{background:#eff6ff;border-left:3px solid var(--p)}
.signal.info{background:#f8fafc;border-left:3px solid var(--t3)}
.signal .sig-tag{font-size:9px;color:var(--t3);font-weight:600;display:block;margin-top:2px}

/* Tables */
.dtable{width:100%;border-collapse:collapse;font-size:11px}
.dtable th{background:#f1f5f9;padding:7px 6px;text-align:left;font-weight:700;color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.dtable td{padding:7px 6px;border-bottom:1px solid #f1f5f9}
.dtable tr:active{background:#f8fafc}

/* Matrix */
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:11px}
.matrix .mh{font-weight:700;color:var(--t2);padding:6px;text-align:center;font-size:10px}
.matrix .mc{border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .15s}
.matrix .mc:active{transform:scale(.96)}
.matrix .mc .mc-n{font-size:22px;font-weight:900}
.matrix .mc .mc-l{font-size:9px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.mc-best{background:#d1fae5;color:#065f46}
.mc-worst{background:#fee2e2;color:#991b1b}
.mc-honest{background:#dbeafe;color:#1e40af}
.mc-gap{background:#fef3c7;color:#92400e}

/* Sandbox banner */
.sandbar{background:linear-gradient(90deg,#fef3c7,#fde68a);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:#92400e}
.sandbar button{background:rgba(146,64,14,.15);border:none;color:#92400e;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;margin-left:4px}

/* Mini bar chart */
.minibar{display:flex;align-items:flex-end;gap:3px;height:50px;margin:8px 0}
.minibar .mbar{flex:1;background:var(--p);border-radius:3px 3px 0 0;min-height:3px;position:relative;transition:height .4s}
.dropoff{display:flex;flex-direction:column;gap:5px}
.dropoff .dorow{display:flex;align-items:center;gap:8px;font-size:11px}
.dropoff .dorow .dolabel{width:90px;color:var(--t2);flex-shrink:0}
.dropoff .dorow .dobar-wrap{flex:1;background:#e8ecf1;border-radius:3px;height:14px;overflow:hidden}
.dropoff .dorow .dobar{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:3px}
.dropoff .dorow .doval{width:54px;text-align:right;font-weight:700;font-size:11px}

.leg{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--g)}.dot-o{background:var(--o)}.dot-r{background:var(--r)}

.tabrow{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tabrow button{flex:1;padding:7px 4px;border:1px solid var(--br);border-radius:var(--rd);background:transparent;color:var(--t2);font-size:11px;font-weight:600;white-space:nowrap}
.tabrow button.s{border-color:var(--p);background:#eff6ff;color:var(--p)}
</style>
</head>
<body>
<div id="TT"></div>
<div id="LL"><div>Loading…</div></div>
<div id="A"></div>
<script>
// ═══════════════════════════════════════════════════════════
// HOST0 — v8.1  Academy Intelligence Platform

var API="https://script.google.com/macros/s/AKfycbwkv-_kQ6io4ZL1mo0E6yqdnuKey5hEb9LJdd48IrhPIw0fTaEMsAappQzQTqS6oq4/exec";
var PIN_C="7391",PIN_A="582946";

var CATS=[

{id:"end",nm:"End of Session",ar:"\u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u062C\u0644\u0633\u0629",ic:"\uD83D\uDCAA",cl:"#d97706",sk:[
{id:"effort",n:"Effort & Discipline",a:"\u0627\u0644\u062C\u0647\u062F"},{id:"coachability",n:"Coachability",a:"\u062A\u0642\u0628\u0644 \u0627\u0644\u062A\u0648\u062C\u064A\u0647"}]}

var RCATS=[
{id:"tech",nm:"Technical",ar:"\u0627\u0644\u0645\u0647\u0627\u0631\u0627\u062A \u0627\u0644\u0641\u0646\u064A\u0629",ic:"\uD83C\uDFC0",cl:"#2563eb",sk:["ball_handling","shooting","passing","layups","defense"]},

{id:"chr",nm:"Character",ar:"\u0627\u0644\u0634\u062E\u0635\u064A\u0629",ic:"\u2B50",cl:"#d97706",sk:["effort","teamwork","sportsmanship","coachability","leadership"]}
];
var SK={};CATS.forEach(function(c){c.sk.forEach(function(s){SK[s.id]=s})});
var SKILL_LIST=Object.keys(SK);

// ─── AGE BANDS (methodology) ──────────────
var AGE_BANDS=[
{id:"foundation",n:"Foundation",range:[6,8]},
{id:"skill_acq",n:"Skill Acquisition",range:[9,11]},
{id:"skill_ref",n:"Skill Refinement",range:[12,14]},

{id:"perf_dev",n:"Performance Development",range:[18,21]},

function ageBand(age){age=Number(age)||0;for(var i=0;i<AGE_BANDS.length;i++){var b=AGE_BANDS[i];if(age>=b.range[0]&&age<=b.range[1])return b}return AGE_BANDS[0]}

// ─── JOIN SOURCES ──────────────
var JOIN_SOURCES={
parent_referral:"Parent referral",friend_referral:"Friend referral",
school_outreach:"School outreach",social_media:"Social media",
walk_in:"Walk-in",other:"Other"
};

// ─── PARENT FEEDBACK v2 — 18 questions ──────────────
var PFB2_Q=[
{k:"q1_experience",q:"How is the experience with HOST so far?",ar:"\u0643\u064A\u0641 \u0627\u0644\u062A\u062C\u0631\u0628\u0629\u061F",opts:["Very happy","Happy","Mixed","Concerned","Unhappy"]},

{k:"q8_time_pref",q:"Preferred session time",ar:"\u0627\u0644\u0648\u0642\u062A \u0627\u0644\u0645\u0641\u0636\u0644",opts:["Current works","Earlier evening","Saturday morning","Weekday afternoon","Other"]},
{k:"q9_comm_pref",q:"Communication frequency you want",ar:"\u062A\u0648\u0627\u062A\u0631 \u0627\u0644\u062A\u0648\u0627\u0635\u0644",opts:["Weekly summary","Monthly","After every session","Daily","Other"]},
{k:"q10_attended_session",q:"Did you attend any session in person this month?",ar:"\u0647\u0644 \u062D\u0636\u0631\u062A \u062C\u0644\u0633\u0629\u061F",opts:["Yes — multiple","Yes — once","No, but planned to","No","Other"]},

{k:"q13_specific",q:"Anything specific you'd like for your child?",ar:"\u0645\u0627 \u062A\u0631\u064A\u062F\u0647 \u0644\u0637\u0641\u0644\u0643\u061F",multi:true,opts:["shooting","defense","game-play","drills","teamwork","position","fitness","mindset","Other"]},

// Sessions sorted oldest→newest
function sessionsSorted(){return S.d.sessions.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)})}

// Per-player stats (skills, attendance, trend)
function stats(pid){
var ev=S.d.evaluations.filter(function(e){return e.player_id===pid&&e.attended});
if(!ev.length)return null;
var lat=ev[ev.length-1],prev=ev.length>=2?ev[ev.length-2]:null;
var byCat={};
RCATS.forEach(function(cat){
var vals=ev.map(function(e){var v=cat.sk.map(function(s){return Number(e.skills[s])||0}).filter(function(x){return x>0});return v.length?av(v):0}).filter(function(x){return x>0});
byCat[cat.id]={avg:av(vals),trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
var bySk={};
SKILL_LIST.forEach(function(sid){
var vals=ev.map(function(e){return Number(e.skills[sid])||0}).filter(function(x){return x>0});
if(vals.length)bySk[sid]={avg:av(vals),lat:vals[vals.length-1],prev:vals.length>=2?vals[vals.length-2]:0,trend:vals.length>=2?vals[vals.length-1]-vals[vals.length-2]:0}});
var overall=av(Object.values(byCat).map(function(c){return c.avg}).filter(function(x){return x>0}));
var prevOverall=0;
if(prev){var pc=[];RCATS.forEach(function(cat){var v=cat.sk.map(function(s){return Number(prev.skills[s])||0}).filter(function(x){return x>0});if(v.length)pc.push(av(v))});prevOverall=av(pc)}
var allEv=S.d.evaluations.filter(function(e){return e.player_id===pid});
var att=allEv.length?(allEv.filter(function(e){return e.attended}).length/allEv.length*100):0;
return{sessions:ev.length,byCat:byCat,bySk:bySk,overall:overall,prevOverall:prevOverall,att:att,latest:lat,prev:prev}
}

function aiConfidence(pid){
var n=S.d.evaluations.filter(function(e){return e.player_id===pid&&e.attended}).length;
if(n<=3)return{label:"LEARNING",sessions:n};
if(n<=9)return{label:"BUILDING",sessions:n};
return{label:"ESTABLISHED",sessions:n};
}

// Drop-off curve — retention at session intervals
function dropoffCurve(){
var sorted=sessionsSorted();
var intervals=[1,4,12,24,48];
var joined=S.d.players.length;
var out=[{label:"Joined",count:joined,pct:100}];
intervals.forEach(function(iv){
// kids who attended at least iv sessions
var retained=S.d.players.filter(function(p){
var n=S.d.evaluations.filter(function(e){return e.player_id===p.id&&e.attended}).length;
return n>=iv||(p.active&&sorted.length<iv);  // still active counts if academy hasn't reached interval
}).length;
// if academy too young for interval, mark as projected
var reached=sorted.length>=iv;
out.push({label:"After "+iv+" sess",count:retained,pct:pct(retained,joined),projected:!reached});
});
return out;
}

// Cohort retention by quarter
function cohortRetention(){
var cohorts={};
S.d.players.forEach(function(p){
var q=p.cohort_quarter||"Unknown";
if(!cohorts[q])cohorts[q]={total:0,active:0};
cohorts[q].total++;
if(p.active)cohorts[q].active++;
});
return cohorts;
}

// Pattern-detected leaver
function patternLeavers(){
var sorted=sessionsSorted();
var threshold=Number(cfgVal("pattern_leaver_consecutive_misses",3));
var out=[];
activePlayers().forEach(function(p){
if(isKidOnHold(p.id))return;
// consecutive misses from the end
var miss=0;
for(var i=sorted.length-1;i>=0;i--){
var ev=S.d.evaluations.find(function(e){return e.session_id===sorted[i].id&&e.player_id===p.id});
if(ev&&ev.attended)break;
miss++;
}
if(miss>=threshold)out.push({pid:p.id,name:p.name,misses:miss});
});
return out;
}

// ── Relationship Health — 3 legs per kid ──
function relationshipHealth(pid){
var p=S.d.players.find(function(x){return x.id===pid});
var st=stats(pid);
// Leg 1: coach-kid (from skill data — engagement: coachability/effort)
var coachLeg="green";
if(st&&st.latest){
var coach=Number(st.latest.skills.coachability)||0,eff=Number(st.latest.skills.effort)||0;
var m=av([coach,eff].filter(function(x){return x>0}));
coachLeg=m>=3.5?"green":m>=2.5?"yellow":"red";
}else coachLeg="gray";
// Leg 2: parent engagement
var pfb=getParentFeedbackV2(pid),checkins=S.d.messages.filter(function(m){return m.type==="parent_checkin"&&String(m.from_name).indexOf(p.name)>=0});
var parentActivity=pfb.length+checkins.length;
var parentLeg=parentActivity>=2?"green":parentActivity===1?"yellow":"red";
// Leg 3: kid commitment (attendance + kid survey pride)
var ac=attendanceCategory(pid);
var ksv=getKidSurveyV2(pid);
var kidLeg="green";
if(ac.pct<30)kidLeg="red";
else if(ac.pct<60)kidLeg="yellow";
if(ksv.length){var pride=ksv[ksv.length-1].q9_pride;if(pride==="Not really"||pride==="I'm not improving")kidLeg="red";else if(pride==="Not sure"&&kidLeg==="green")kidLeg="yellow"}
var legs=[coachLeg,parentLeg,kidLeg];
var redCount=legs.filter(function(l){return l==="red"}).length;
var yellowCount=legs.filter(function(l){return l==="yellow"}).length;
var overall=redCount>=2?"priority":redCount===1||yellowCount>=2?"partial":"healthy";
return{coachLeg:coachLeg,parentLeg:parentLeg,kidLeg:kidLeg,overall:overall,redCount:redCount,yellowCount:yellowCount};
}

// ── Development Picture — triangulation ──
function developmentSignal(pid){
var st=stats(pid);
// Coach view: improving / stable / declining
var coachDir="nodata";
if(st&&st.prev){
var d=st.overall-st.prevOverall;
coachDir=d>0.15?"up":d<-0.15?"down":"stable";
}
// Parent feeling (from feedback experience trend + value)
var pfb=getParentFeedbackV2(pid);
var parentDir="nodata";
if(pfb.length){
var last=pfb[pfb.length-1];
var exp=last.q1_experience,val=last.q3_value;
if(exp==="Very happy"||exp==="Happy"){parentDir="up"}
else if(exp==="Mixed"){parentDir=(val==="Poor value"||val==="Acceptable")?"down":"stable"}
else parentDir="down";
}
// Kid self-perception (from pride q9)
var ksv=getKidSurveyV2(pid);
var kidDir="nodata";
if(ksv.length){
var pride=ksv[ksv.length-1].q9_pride;
if(pride==="Very proud"||pride==="A bit proud")kidDir="up";
else if(pride==="Not sure")kidDir="stable";
else kidDir="down";
}
// Alignment
var familyFeels=(parentDir==="up"||kidDir==="up")&&parentDir!=="down"&&kidDir!=="down";
var familyDoesnt=(parentDir==="down"||kidDir==="down"||parentDir==="stable"||kidDir==="stable")&&!(parentDir==="up"&&kidDir==="up");
var coachSaysUp=coachDir==="up";
var quad;
if(coachSaysUp&&familyFeels)quad="best";
else if(coachSaysUp&&!familyFeels)quad="worst";   // TRUST MISMATCH
else if(!coachSaysUp&&familyFeels)quad="honest";
else quad="gap";
return{coachDir:coachDir,parentDir:parentDir,kidDir:kidDir,quad:quad};
}

// ── Methodology compliance ──
function methodologyCheck(){
// group active kids by age band, compare to methodology reference
var tier=cfgVal("methodology_tier","Normal");
var bands={};
activePlayers().forEach(function(p){
var b=ageBand(p.age);
if(!bands[b.id])bands[b.id]={band:b,kids:[]};
bands[b.id].kids.push(p);
});
var out=[];
Object.values(bands).forEach(function(grp){
var ref=S.d.methodology.find(function(m){return String(m.age_band).indexOf(grp.band.n)>=0&&m.tier===tier});
var min=ref?Number(ref.group_min):6,max=ref?Number(ref.group_max):15;
var n=grp.kids.length;
var status=n<min?"below":n>max?"above":"ok";
out.push({band:grp.band.n,count:n,min:min,max:max,status:status,kids:grp.kids});
});
return out;
}

// ── Academy Insights synthesis (Card 1) ──
function buildInsights(){
var lookingGood=[],lookInto=[];
var players=activePlayers();

// Business signals
var joiners=joinersBySource();
var topSource=Object.keys(joiners).sort(function(a,b){return joiners[b]-joiners[a]})[0];
if(topSource&&joiners[topSource]>=2)
lookingGood.push({card:"Business Growth",cardKey:"growth",text:(JOIN_SOURCES[topSource]||topSource)+" is your strongest acquisition channel ("+joiners[topSource]+" joiners)"});

var cohorts=cohortRetention();
Object.keys(cohorts).forEach(function(q){
if(q!=="Unknown"&&cohorts[q].total>=2&&cohorts[q].active===cohorts[q].total)
lookingGood.push({card:"Business Growth",cardKey:"growth",text:q+" cohort at 100% retention ("+cohorts[q].total+" kids)"});
});

// Pattern leavers → high priority
var pl=patternLeavers();
pl.forEach(function(l){
lookInto.push({pri:"HIGH",card:"Relationship Health",cardKey:"relationship",text:l.name+" missed "+l.misses+" consecutive sessions — reach out this week"});
});

// Trust mismatches → high priority
players.forEach(function(p){
var sig=developmentSignal(p.id);
if(sig.quad==="worst")
lookInto.push({pri:"HIGH",card:"Development Picture",cardKey:"development",text:p.name+" trust mismatch — coach sees progress, family doesn't. Send video evidence."});
});

// Value perception → medium
var valueConcerns=0;
players.forEach(function(p){
var pfb=getParentFeedbackV2(p.id);
if(pfb.length&&pfb[pfb.length-1].q3_value==="Poor value")valueConcerns++;
});
if(valueConcerns>0)
lookInto.push({pri:"MED",card:"Customer Feedback",cardKey:"feedback",text:valueConcerns+" parent(s) flagged poor value-for-money"});

// Multi-leg risk → medium
players.forEach(function(p){
var rh=relationshipHealth(p.id);
if(rh.overall==="priority"){
var already=lookInto.some(function(x){return x.text.indexOf(p.name)>=0});
if(!already)lookInto.push({pri:"MED",card:"Relationship Health",cardKey:"relationship",text:p.name+" — multiple relationship signals weakening"});
}
});

// Venue/timing → low
var vs=venueSignals();
var morningWant=(vs.timingPref["Sat morning"]||0)+(vs.timingPref["Saturday morning"]||0);
if(morningWant>=3)
lookInto.push({pri:"LOW",card:"Session Health",cardKey:"sessions",text:morningWant+" parents prefer a morning slot — consider piloting"});
if(vs.concernCount>=3)
lookInto.push({pri:"LOW",card:"Session Health",cardKey:"sessions",text:vs.concernCount+" parents rated venue Adequate or worse"});

// Coach health
var cf=getCoachFeedback();
if(cf.length){
var lastCf=cf[cf.length-1];
lookingGood.push({card:"Customer Feedback",cardKey:"feedback",text:"Coach actively reporting — "+cf.length+" monthly feedback submissions"});
}

// Sort lookInto by priority
var prio={HIGH:3,MED:2,LOW:1,INFO:0};
lookInto.sort(function(a,b){return (prio[b.pri]||0)-(prio[a.pri]||0)});

return{lookingGood:lookingGood,lookInto:lookInto};
}

function insightsSynthesis(){
var ins=buildInsights();
var players=activePlayers();

paras.push("This was "+mood+". You have "+players.length+" active kids"+(totalJoin?", "+totalJoin+" recent joiners":"")+", and "+ins.lookingGood.length+" positive signals worth protecting.");

// Render an AI recommendation card
function aiRecCard(title,rec){
if(!rec)return'';
var h='<div class="airec"><div class="airec-h">\uD83E\uDDE0 HOST AI Recommendation'+(title?" \u2014 "+title:"")+'</div><div class="airec-b">';
if(rec.data&&rec.data.length){
h+='<div class="data-box"><b style="display:block;margin-bottom:4px;color:var(--p)">Your data:</b>';
rec.data.forEach(function(d){h+='\u2022 '+d+'<br>'});
h+='</div>';
}
if(rec.verdict)h+='<div class="verdict">'+rec.verdict+'</div>';
(rec.decisions||[]).forEach(function(d,i){
h+='<div class="decision"><div class="dh">'+(i+1)+'\uFE0F\u20E3 '+d.cat+'</div><div class="dt">'+d.text+'</div></div>';
});
h+='</div></div>';
return h;
}

function signalRow(s){
var icMap={good:"\u2705",HIGH:"\uD83D\uDEA8",MED:"\uD83D\uDFE0",LOW:"\uD83D\uDD35",INFO:"\u2139\uFE0F"};
var clsMap={good:"good",HIGH:"high",MED:"med",LOW:"low",INFO:"info"};
var key=s.pri||"good";
return '<div class="signal '+clsMap[key]+'"><span class="sig-ic">'+icMap[key]+'</span><div>'+s.text+'<span class="sig-tag">from: '+s.card+'</span></div></div>';
}

var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 class="tl" style="margin:0">Players ('+pl.length+')</h2><button class="btn bp" onclick="document.getElementById(\'af\').classList.toggle(\'hid\')">+ Add</button></div>';

h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
h+='<div class="fg"><label class="fl">Name *</label><input class="fi" id="np_n"></div>';
h+='<div class="fg"><label class="fl">Age</label><input class="fi" id="np_a" type="number"></div>';
h+='<div class="fg"><label class="fl">Parent name</label><input class="fi" id="np_p"></div>';
h+='<div class="fg"><label class="fl">Parent phone</label><input class="fi" id="np_ph"></div>';
h+='<div class="fg"><label class="fl">Parent PIN (4 digit)</label><input class="fi" id="np_pin" type="number"></div>';
h+='<div class="fg"><label class="fl">Join source</label><select class="fi" id="np_src">';
Object.keys(JOIN_SOURCES).forEach(function(k){h+='<option value="'+k+'">'+JOIN_SOURCES[k]+'</option>'});
h+='</select></div>';
h+='</div>';
h+='<div class="fg"><label class="fl">Medical notes</label><input class="fi" id="np_m"></div>';
h+='<button class="btn bp bf" onclick="addP()">Save Player</button></div></div>';

// sort
h+='<div class="tabrow">';
["score","name","age"].forEach(function(s){h+='<button class="'+(S.adminSort===s?"s":"")+'" onclick="S.adminSort=\''+s+'\';R()">'+(s==="score"?"Score":s==="name"?"Name":"Age")+'</button>'});
h+='</div>';
var sorted=pl.slice();
if(S.adminSort==="score")sorted.sort(function(a,b){var sa=stats(a.id),sb=stats(b.id);return(sb?sb.overall:0)-(sa?sa.overall:0)});
else if(S.adminSort==="name")sorted.sort(function(a,b){return a.name.localeCompare(b.name)});
else sorted.sort(function(a,b){return(a.age||0)-(b.age||0)});

sorted.forEach(function(p){
var st=stats(p.id);
var sc=st?(st.overall>=3?"var(--g)":st.overall>=2?"var(--o)":"var(--r)"):"var(--t3)";
var ks=getKidStatus(p.id);
var sib=p.sibling_links?' \uD83D\uDC6A':'';
h+='<div class="cd" style="cursor:pointer" onclick="S.sp=\''+p.id+'\';R()"><div class="cb" style="padding:10px 14px;display:flex;align-items:center;gap:10px">';
h+='<div class="av">'+esc(p.name.charAt(0))+'</div>';
h+='<div style="flex:1"><div style="font-weight:700;font-size:14px">'+esc(p.name)+(p.age?" ("+p.age+")":"")+sib+'</div>';
h+='<div style="font-size:11px;color:var(--t2)">'+esc(p.parent_name||"\u2014")+' \u00B7 PIN:'+p.parent_pin+'</div>';
h+='<div style="display:flex;gap:5px;margin-top:2px">';
if(st)h+='<span style="font-size:9px;color:var(--t3)">'+st.sessions+'s \u00B7 '+st.att.toFixed(0)+'%</span>';
if(p.medical_notes)h+='<span style="font-size:9px;color:var(--o)">\u2695 '+esc(p.medical_notes)+'</span>';
if(ks!=="active")h+='<span style="font-size:9px;color:'+KID_STATUS_COLORS[ks]+'">'+KID_STATUS_ICONS[ks]+' '+KID_STATUS_LABELS[ks]+'</span>';
h+='</div></div>';
if(st)h+='<div style="text-align:center"><div style="font-size:22px;font-weight:800;color:'+sc+'">'+st.overall.toFixed(1)+'</div></div>';
h+='</div></div>';
});
return h;
}
function addP(){
var n=document.getElementById("np_n").value.trim();if(!n){toast("Name required");return}
var pin=document.getElementById("np_pin").value.trim()||String(Math.floor(1000+Math.random()*9000));
apiPost({action:"addPlayer",player:{
id:gid(),name:n,age:document.getElementById("np_a").value,
parent_name:document.getElementById("np_p").value.trim(),
parent_phone:document.getElementById("np_ph").value.trim(),
parent_pin:pin,join_source:document.getElementById("np_src").value,
join_date:new Date().toISOString(),active:true,
medical_notes:document.getElementById("np_m").value.trim(),
kid_status_current:"active",backfill_source:""
}}).then(function(ok){if(ok){toast(n+" added (PIN "+pin+")");R()}});
}

// Admin report (per kid) — reuse simple version + delete
function vAdminReport(){
var p=S.d.players.find(function(x){return x.id===S.sp});if(!p)return"Not found";
var st=stats(p.id);
var h='<button class="backbtn" onclick="S.sp=null;R()">\u2190 Back</button>';
h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="av" style="width:48px;height:48px;font-size:20px">'+esc(p.name.charAt(0))+'</div><div><div style="font-size:20px;font-weight:800">'+esc(p.name)+'</div><div style="font-size:12px;color:var(--t2)">Age '+p.age+(st?" \u00B7 "+st.sessions+" sessions":"")+'</div></div></div>';

// Development signal for this kid
var sig=developmentSignal(p.id);
var rh=relationshipHealth(p.id);
h+='<div class="section"><div class="section-h">Development Signal</div><div class="section-b">';
h+=metricRow("Coach view",sig.coachDir==="up"?'<span style="color:var(--g)">Improving \u2191</span>':sig.coachDir==="down"?'<span style="color:var(--r)">Declining \u2193</span>':sig.coachDir==="stable"?'Stable \u2192':'Not enough data');
h+=metricRow("Parent feeling",esc(sig.parentDir));
h+=metricRow("Kid self-view",esc(sig.kidDir));
h+=metricRow("Relationship",rh.overall==="priority"?'<span style="color:var(--r);font-weight:700">Priority risk</span>':rh.overall==="partial"?'<span style="color:var(--o)">Partial</span>':'<span style="color:var(--g)">Healthy</span>');
h+='</div></div>';

// Skills
if(st){
h+='<div class="section"><div class="section-h">Skills (latest)</div><div class="section-b">';
RCATS.forEach(function(cat){
var cd=st.byCat[cat.id];if(!cd||!cd.avg)return;
h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:700">'+cat.ic+' '+cat.nm+'</span><span style="color:'+rc(cd.avg)+';font-weight:700">'+cd.avg.toFixed(1)+'</span></div>';
cat.sk.forEach(function(sid){var sd=st.bySk[sid];if(!sd)return;h+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);padding:1px 0 1px 12px"><span>'+SK[sid].n+'</span><span style="color:'+rc(sd.lat)+'">'+sd.lat+(sd.trend>0?" \u2191":sd.trend<0?" \u2193":"")+'</span></div>'});
h+='</div>';
});
h+='</div></div>';
}else h+='<div class="ib">No evaluation data yet for this kid.</div>';

// If trust mismatch, show the AI rec
if(sig.quad==="worst")h+=aiRecCard(esc(p.name),aiRecTrustMismatch(p.id));

// Edit/delete controls
h+='<div class="section"><div class="section-h">Manage</div><div class="section-b">';
h+='<div class="fg"><label class="fl">Status</label><select class="fi" onchange="setKidStatusV(\''+p.id+'\',this.value)">';
KID_STATUS.forEach(function(s){h+='<option value="'+s+'"'+(getKidStatus(p.id)===s?" selected":"")+'>'+KID_STATUS_ICONS[s]+' '+KID_STATUS_LABELS[s]+'</option>'});
h+='</select></div>';
h+='<button class="btn br bf" onclick="delP(\''+p.id+'\',\''+esc(p.name).replace(/'/g,"")+'\')">Delete Player</button>';
h+='</div></div>';
return h;
}
function setKidStatusV(pid,status){
var p=S.d.players.find(function(x){return x.id===pid});if(!p)return;
p.kid_status_current=status;
apiPost({action:"updatePlayer",player:p}).then(function(ok){if(ok){toast("Status: "+KID_STATUS_LABELS[status]);R()}});
}
function delP(pid,name){
if(!confirm("Delete "+name+"? This removes the player. Evaluations remain unless cleared."))return;
apiPost({action:"deletePlayer",id:pid}).then(function(ok){if(ok){toast("Deleted");S.sp=null;R()}});
}

function scTrustMismatch(){
var p=activePlayers()[0];if(!p)return;
// add a parent feedback with poor value + kid survey not improving
var d1={q1_experience:"Mixed",q2_recommend:"Not sure",q3_value:"Poor value",q4_concern:"Progress visibility",q9_comm_pref:"After every session",q14_improve:"videos,longer reports",q15_venue:"Good",q17_timing:"Acceptable"};
var d2={q1_month:"Mixed",q7_coach:"Like them",q9_pride:"I'm not improving",q10_recommend:"Not sure",q11_venue:"Okay"};
Promise.all([
apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:(p.parent_name||"Parent")+" \u2192 "+p.name,text:"MFB2:"+JSON.stringify(d1),type:"parent_feedback_v2"}}),
apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:p.name+" (Player)",text:"KSV2:"+JSON.stringify(d2),type:"kid_survey_v2"}})
]).then(function(){toast("Trust mismatch added for "+p.name);R()});
}
function scDeparture(){
var p=activePlayers().find(function(x){return attendanceCategory(x.id).cat!=="Drifting"})||activePlayers()[0];if(!p)return;
// add 3 sessions where this kid is absent
var promises=[];
for(var i=0;i<3;i++){
var sid=gid()+"_dep"+i;
var session={id:sid,date:new Date(Date.now()-i*7*864e5).toISOString(),coach:"Coach Yasser",plan:"",notes:"Sandbox departure",completed:true,venue_id:"main_cairo",branch_id:"host_cairo",age_band:"mixed",methodology_tier_used:"Normal",backfill_source:""};
var evals=activePlayers().map(function(pp){var sk={};SKILL_LIST.forEach(function(s){sk[s]=3});return{session_id:sid,player_id:pp.id,player_name:pp.name,attended:pp.id!==p.id,skills:pp.id!==p.id?sk:{},notes:"",approach:[],outcome:[],parent_attended:false}});
promises.push(apiPost({action:"saveSession",session:session,evaluations:evals}));
}
Promise.all(promises).then(function(){toast("Departure pattern added for "+p.name);R()});
}
function scValueConcern(){
var ps=activePlayers().slice(0,2);
var promises=ps.map(function(p){
var d={q1_experience:"Mixed",q2_recommend:"Not sure",q3_value:"Poor value",q4_concern:"Cost",q15_venue:"Good",q17_timing:"Acceptable"};
return apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:(p.parent_name||"Parent")+" \u2192 "+p.name,text:"MFB2:"+JSON.stringify(d),type:"parent_feedback_v2"}});
});
Promise.all(promises).then(function(){toast("Value concern added");R()});
}

var h='<h2 class="tl">New Session</h2>';
h+='<div class="cd"><div class="cb">';
h+='<div class="fg"><label class="fl">Coach name</label><input class="fi" id="cs_coach" value="'+esc(S.coach||"Coach Yasser")+'"></div>';
h+='<div class="fg"><label class="fl">Date</label><input class="fi" type="date" id="cs_date" value="'+new Date().toISOString().slice(0,10)+'"></div>';
h+='<button class="btn bp bf" onclick="startCoachSess()">Start Evaluation</button>';
h+='</div></div>';
// recent sessions
var recent=sessionsSorted().reverse().slice(0,3);
if(recent.length){h+='<div class="cd"><div class="ch">Recent Sessions</div><div class="cb">';
recent.forEach(function(s){var ev=S.d.evaluations.filter(function(e){return e.session_id===s.id});var att=ev.filter(function(e){return e.attended}).length;h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span>'+fd(s.date)+'</span><span style="font-weight:700">'+att+'/'+ev.length+'</span></div>'});
h+='</div></div>';}
return h;
}
function startCoachSess(){
S.coach=document.getElementById("cs_coach").value.trim()||"Coach";
var date=document.getElementById("cs_date").value;
S.sess={id:gid(),date:new Date(date).toISOString(),coach:S.coach};
S.evals=activePlayers().map(function(p){var sk={};SKILL_LIST.forEach(function(s){sk[s]=3});return{pid:p.id,pn:p.name,att:true,sk:sk,pa:false}});
S.ct="evaluating";R();
}
function vCoachEval(){
var h='<div class="ct"><h2 class="tl">Evaluate \u00B7 '+fd(S.sess.date)+'</h2>';
h+='<div class="ib" style="margin-bottom:10px">Tap attendance, set ratings 1-5 for each skill. Tap "Parent watched" if a parent attended.</div>';
S.evals.forEach(function(e,i){
h+='<div class="cd"><div class="cb">';
h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button class="lb" style="flex:none;width:auto;padding:4px 12px;margin:0;'+(e.att?"border-color:var(--g);background:#ecfdf5;color:var(--g)":"border-color:var(--r);background:#fef2f2;color:var(--r)")+'" onclick="S.evals['+i+'].att=!S.evals['+i+'].att;R()">'+(e.att?"\u2705 Present":"\u274C Absent")+'</button><span style="font-weight:700;flex:1">'+esc(e.pn)+'</span><button class="lb" style="flex:none;width:auto;padding:4px 10px;margin:0;font-size:10px;'+(e.pa?"border-color:var(--p);background:#eff6ff;color:var(--p)":"")+'" onclick="S.evals['+i+'].pa=!S.evals['+i+'].pa;R()">'+(e.pa?"\uD83D\uDC41 Parent watched":"Parent?")+'</button></div>';
if(e.att){
SKILL_LIST.forEach(function(sid){
h+='<div style="display:flex;align-items:center;gap:6px;padding:2px 0"><span style="flex:1;font-size:11px;color:var(--t2)">'+SK[sid].n+'</span>';
for(var v=1;v<=5;v++)h+='<button onclick="S.evals['+i+'].sk[\''+sid+'\']='+v+';R()" style="width:26px;height:26px;border-radius:6px;border:1.5px solid '+(e.sk[sid]===v?rc(v):"var(--br)")+';background:'+(e.sk[sid]===v?rc(v):"transparent")+';color:'+(e.sk[sid]===v?"#fff":"var(--t3)")+';font-weight:700;font-size:11px">'+v+'</button>';
h+='</div>';
});
}
h+='</div></div>';
});
h+='<button class="btn bg bf bl" onclick="saveCoachSess()">Save Session</button>';
h+='<button class="btn bs bf" style="margin-top:8px" onclick="S.ct=\'evaluate\';S.sess=null;R()">Cancel</button>';
h+='</div>';
return h;
}
function saveCoachSess(){
var session={id:S.sess.id,date:S.sess.date,coach:S.sess.coach,plan:"",notes:"",completed:true,venue_id:"main_cairo",branch_id:"host_cairo",age_band:"mixed",methodology_tier_used:cfgVal("methodology_tier","Normal"),backfill_source:""};
var evals=S.evals.map(function(e){return{session_id:session.id,player_id:e.pid,player_name:e.pn,attended:e.att,skills:e.att?e.sk:{},notes:"",approach:[],outcome:[],parent_attended:e.pa}});
apiPost({action:"saveSession",session:session,evaluations:evals}).then(function(ok){if(ok){toast("Saved \uD83C\uDFC0");S.ct="evaluate";S.sess=null;S.evals=[];R()}});
}
function vCoachPlayers(){
var h='<h2 class="tl">Players</h2>';
activePlayers().forEach(function(p){var st=stats(p.id);h+='<div class="cd"><div class="cb" style="padding:10px 14px;display:flex;align-items:center;gap:10px"><div class="av">'+esc(p.name.charAt(0))+'</div><div style="flex:1"><div style="font-weight:700;font-size:13px">'+esc(p.name)+'</div><div style="font-size:11px;color:var(--t2)">Age '+p.age+(p.medical_notes?' \u00B7 \u2695 '+esc(p.medical_notes):'')+'</div></div>'+(st?'<div style="font-size:20px;font-weight:800;color:'+rc(st.overall)+'">'+st.overall.toFixed(1)+'</div>':'')+'</div></div>'});
return h;
}
function vCoachFeedbackForm(){
var h='<h2 class="tl">\uD83D\uDCDD Monthly Coach Feedback</h2>';
h+='<div class="ib" style="margin-bottom:10px">Your monthly read on groups, venue, and kids needing attention.</div>';
h+='<div class="cd"><div class="cb">';
CFB_Q.forEach(function(q,qi){
h+='<div class="fg"><label class="fl">'+q.q+'</label>';
if(q.free){h+='<input class="fi" id="cf_'+q.k+'">'}
else if(q.multi){h+='<div style="display:flex;flex-wrap:wrap;gap:4px" id="cf_'+q.k+'">';q.opts.forEach(function(o){h+='<button class="lb" style="flex:none;width:auto;padding:5px 10px;margin:0;font-size:11px" onclick="this.classList.toggle(\'s\')">'+esc(o)+'</button>'});h+='</div>'}
else{h+='<div style="display:flex;flex-wrap:wrap;gap:4px" id="cf_'+q.k+'">';q.opts.forEach(function(o){h+='<button class="lb" style="flex:none;width:auto;padding:5px 10px;margin:0;font-size:11px" onclick="var p=this.parentNode;p.querySelectorAll(\'button\').forEach(function(b){b.classList.remove(\'s\')});this.classList.add(\'s\')">'+esc(o)+'</button>'});h+='</div>'}
h+='</div>';
});
h+='<button class="btn bp bf bl" onclick="submitCoachFeedback()">Submit Feedback</button>';
h+='</div></div>';
return h;
}
function submitCoachFeedback(){
var data={};
CFB_Q.forEach(function(q){
var el=document.getElementById("cf_"+q.k);if(!el)return;
if(q.free){data[q.k]=el.value.trim()}
else if(q.multi){data[q.k]=Array.prototype.slice.call(el.querySelectorAll(".s")).map(function(b){return b.textContent}).join(",")}
else{var s=el.querySelector(".s");data[q.k]=s?s.textContent:""}
});
apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:S.coach||"Coach",text:"CFB:"+JSON.stringify(data),type:"coach_feedback"}}).then(function(ok){if(ok){toast("Thank you! Feedback saved");S.ct="evaluate";R()}});
}

// ═══════════════════════════════════════════════════════════
//  PARENT VIEW (report + monthly feedback v2)
// ═══════════════════════════════════════════════════════════
function vParent(){
var ch=S.d.players.find(function(p){return p.id===S.cid});if(!ch)return"Not found";
var h='<div class="hd" style="background:linear-gradient(135deg,#047857,#059669)"><div><h2>\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67 '+esc(ch.name)+'</h2><small>Parent Portal</small></div><button class="hb" onclick="logout()">Logout</button></div>';
var tabs=[["report","\uD83D\uDCCA","Progress"],["feedback","\u2B50","Feedback"]];
h+='<div class="nv">';tabs.forEach(function(t){h+='<button class="'+(S.pt===t[0]?"a":"")+'" onclick="S.pt=\''+t[0]+'\';R()"><span style="font-size:16px">'+t[1]+'</span>'+t[2]+'</button>'});h+='</div><div class="ct">';
if(S.pt==="report")h+=vParentReport(ch);
else if(S.pt==="feedback")h+=vParentFeedbackForm(ch);
h+='</div>';
return h;
}
function vParentReport(ch){
var st=stats(ch.id);
var h='<h2 class="tl">'+esc(ch.name)+'</h2>';
if(!st){h+='<div class="ib">Reports begin after the first session.</div>';return h}
var ac=attendanceCategory(ch.id);
h+='<div class="cd"><div class="cb" style="text-align:center"><div style="font-size:36px;font-weight:900;color:'+rc(st.overall)+'">'+st.overall.toFixed(1)+'<span style="font-size:16px;color:var(--t3)">/5</span></div><div style="font-size:12px;color:var(--t2)">'+st.sessions+' sessions \u00B7 '+ac.pct+'% attendance</div></div></div>';
RCATS.forEach(function(cat){var cd=st.byCat[cat.id];if(!cd||!cd.avg)return;h+='<div class="cd"><div class="ch">'+cat.ic+' '+cat.nm+' \u2014 '+cd.avg.toFixed(1)+'</div><div class="cb">';cat.sk.forEach(function(sid){var sd=st.bySk[sid];if(!sd)return;h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>'+SK[sid].n+'</span><span style="color:'+rc(sd.lat)+';font-weight:700">'+rl(sd.lat)+(sd.trend>0?" \u2191":sd.trend<0?" \u2193":"")+'</span></div>'});h+='</div></div>'});
return h;
}
function vParentFeedbackForm(ch){
var h='<h2 class="tl">\u2B50 Monthly Feedback</h2><div class="ib" style="margin-bottom:10px">Takes 3-5 minutes. Tap your answers.</div>';
h+='<div class="cd"><div class="cb">';
PFB2_Q.forEach(function(q){
h+='<div class="fg"><label class="fl">'+q.q+'</label>';
h+='<div style="display:flex;flex-wrap:wrap;gap:4px" id="pf_'+q.k+'" data-multi="'+(q.multi?1:0)+'">';
q.opts.forEach(function(o){
if(q.multi)h+='<button class="lb" style="flex:none;width:auto;padding:5px 10px;margin:0;font-size:11px" onclick="this.classList.toggle(\'s\')">'+esc(o)+'</button>';
else h+='<button class="lb" style="flex:none;width:auto;padding:5px 10px;margin:0;font-size:11px" onclick="var p=this.parentNode;p.querySelectorAll(\'button\').forEach(function(b){b.classList.remove(\'s\')});this.classList.add(\'s\')">'+esc(o)+'</button>';
});
h+='</div></div>';
});
h+='<button class="btn bp bf bl" onclick="submitParentFeedback(\''+ch.id+'\')">Submit</button>';
h+='</div></div>';
return h;
}
function submitParentFeedback(pid){
var ch=S.d.players.find(function(p){return p.id===pid});
var data={};
PFB2_Q.forEach(function(q){
var el=document.getElementById("pf_"+q.k);if(!el)return;
if(q.multi){data[q.k]=Array.prototype.slice.call(el.querySelectorAll(".s")).map(function(b){return b.textContent}).join(",")}
else{var s=el.querySelector(".s");data[q.k]=s?s.textContent:""}
});
if(!data.q1_experience){toast("Please answer at least the first question");return}
apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:(ch.parent_name||"Parent")+" \u2192 "+ch.name,text:"MFB2:"+JSON.stringify(data),type:"parent_feedback_v2"}}).then(function(ok){if(ok){toast("Thank you! \uD83D\uDE4F");S.pt="report";R()}});
}

// ═══════════════════════════════════════════════════════════
//  KID VIEW (progress + survey v2)
// ═══════════════════════════════════════════════════════════
function vKid(){
var ch=S.d.players.find(function(p){return p.id===S.cid});if(!ch)return"Not found";
var h='<div class="hd" style="background:linear-gradient(135deg,#0e7490,#06b6d4)"><div><h2>\uD83C\uDFC0 '+esc(ch.name)+'</h2><small>Player Portal</small></div><button class="hb" onclick="logout()">Logout</button></div>';
var tabs=[["progress","\uD83C\uDF31","Progress"],["rate","\u2B50","My Survey"]];
h+='<div class="nv">';tabs.forEach(function(t){h+='<button class="'+(S.kt===t[0]?"a":"")+'" onclick="S.kt=\''+t[0]+'\';R()"><span style="font-size:16px">'+t[1]+'</span>'+t[2]+'</button>'});h+='</div><div class="ct">';
if(S.kt==="progress")h+=vKidProgress(ch);
else if(S.kt==="rate")h+=vKidSurvey(ch);
h+='</div>';
return h;
}
function vKidProgress(ch){
var st=stats(ch.id);
var h='<h2 class="tl">My Progress \uD83C\uDFC0</h2>';
if(!st){h+='<div class="ib">Your progress shows up after your first session!</div>';return h}
h+='<div class="cd"><div class="cb" style="text-align:center"><div style="font-size:48px">\uD83C\uDFC0</div><div style="font-size:32px;font-weight:900;color:'+rc(st.overall)+'">'+st.overall.toFixed(1)+'</div><div style="font-size:12px;color:var(--t2)">You\'ve done '+st.sessions+' sessions!</div></div></div>';
// top skills
var top=Object.keys(st.bySk).map(function(sid){return{n:SK[sid].n,v:st.bySk[sid].lat}}).sort(function(a,b){return b.v-a.v}).slice(0,3);
h+='<div class="cd"><div class="ch">\u2B50 Your Strengths</div><div class="cb">';
top.forEach(function(t){h+='<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>'+t.n+'</span><span style="color:var(--g);font-weight:700">'+rl(t.v)+'</span></div>'});
h+='</div></div>';
return h;
}
function vKidSurvey(ch){
var h='<h2 class="tl">\u2B50 My Survey</h2><div class="ib" style="margin-bottom:10px">Tell us how training is going!</div>';
h+='<div class="cd"><div class="cb">';
KSV2_Q.forEach(function(q){
h+='<div class="fg"><label class="fl">'+q.q+'</label><div style="display:flex;flex-wrap:wrap;gap:4px" id="ks_'+q.k+'">';
q.opts.forEach(function(o){h+='<button class="lb" style="flex:none;width:auto;padding:6px 12px;margin:0;font-size:12px" onclick="var p=this.parentNode;p.querySelectorAll(\'button\').forEach(function(b){b.classList.remove(\'s\')});this.classList.add(\'s\')">'+esc(o)+'</button>'});
h+='</div></div>';
});
h+='<button class="btn bp bf bl" onclick="submitKidSurvey(\''+ch.id+'\')">Submit</button>';
h+='</div></div>';
return h;
}
function submitKidSurvey(pid){
var ch=S.d.players.find(function(p){return p.id===pid});
var data={};
KSV2_Q.forEach(function(q){var el=document.getElementById("ks_"+q.k);if(!el)return;var s=el.querySelector(".s");data[q.k]=s?s.textContent:""});
if(!data.q1_month){toast("Tell us how training was!");return}
apiPost({action:"sendMessage",message:{id:gid(),date:new Date().toISOString(),from_name:ch.name+" (Player)",text:"KSV2:"+JSON.stringify(data),type:"kid_survey_v2"}}).then(function(ok){if(ok){toast("Thanks! \uD83C\uDFC0");S.kt="progress";R()}});
}

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
R();

</script>
</body>
